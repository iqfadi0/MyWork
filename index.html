<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  padding:15px;
}

h1{text-align:center;margin-bottom:20px}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  background:#22c55e;
  border:none;
  border-radius:12px;
  padding:12px;
}

.box{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
}

.add{
  width:100%;
  margin-top:10px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  padding:14px;
  border:none;
  border-radius:12px;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
  margin-top:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}

.total{
  text-align:center;
  margin-top:20px;
  font-size:22px;
}

.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  margin-bottom:10px;
  color:white;
}

/* ❌ زر الحذف الصغير */
.delete-x{
  background:#ef4444;
  border:none;
  color:white;
  width:28px;
  height:28px;
  border-radius:50%;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
<button onclick="showPage('report')">📊</button>
</div>

<!-- HOME -->
<div id="homePage">
<div class="box">
<input placeholder="Customer Name" id="name">
<select id="sub"></select>
<input type="number" placeholder="Cost $" id="cost">
<input type="number" placeholder="Sell $" id="sell">
<button class="add" onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input class="search" placeholder="🔍 Search..." id="search" oninput="render()">
<div id="list"></div>
<div class="total" id="total"></div>
</div>

<!-- REPORT -->
<div id="reportPage" style="display:none">
<div id="reportData"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("data")||"[]");

const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(r){
 return (Number(r.sell)-Number(r.cost))||0;
}

function showPage(p){
 document.getElementById("homePage").style.display="none";
 document.getElementById("customersPage").style.display="none";
 document.getElementById("reportPage").style.display="none";

 if(p==="home") document.getElementById("homePage").style.display="block";
 if(p==="customers"){document.getElementById("customersPage").style.display="block"; render();}
 if(p==="report"){document.getElementById("reportPage").style.display="block"; showReport();}
}

/* RENDER */
function render(){
 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{

 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let cost = parseFloat(r.cost) || 0;
 let sell = parseFloat(r.sell) || 0;
 let p = sell - cost;

 total+=p;

 list.innerHTML+=`
 <div class="card">

   <div style="display:flex;justify-content:space-between;align-items:center">
     <b>${r.name || "No Name"}</b>

     <button class="delete-x" onclick="del(${i})">×</button>
   </div>

   <div style="display:flex;justify-content:space-between;margin-top:5px">
     <span>${r.sub || ""}</span>
   </div>

   <div class="row"><span>Cost</span><span>${cost.toFixed(2)}$</span></div>
   <div class="row"><span>Sell</span><span>${sell.toFixed(2)}$</span></div>

   <div class="row">
     <span>Profit</span>
     <span style="color:${p>=0 ? "#22c55e" : "#ef4444"}">${p.toFixed(2)}$</span>
   </div>

 </div>
 `;
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

/* ADD */
function add(){

 let n = document.getElementById("name").value.trim();
 let s = document.getElementById("sub").value;
 let c = document.getElementById("cost").value;
 let se = document.getElementById("sell").value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.push({
   name:n,
   sub:s,
   cost:parseFloat(c) || 0,
   sell:parseFloat(se) || 0
 });

 save();
 render();
 showPage("customers");

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";
}

/* ❌ DELETE WITH CONFIRM */
function del(i){
 if(confirm("Delete this customer?")){
   data.splice(i,1);
   save();
   render();
 }
}

/* REPORT */
function showReport(){
 let total=0;
 data.forEach(r=> total+=calc(r));
 document.getElementById("reportData").innerHTML="Total Profit: "+total.toFixed(2)+" $";
}

</script>

</body>
</html>
