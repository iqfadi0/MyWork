<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#020617">

<style>
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont;
  background:#020617;
  color:white;
  padding:15px;
}

/* 🔥 عنوان */
h1{
  text-align:center;
  font-size:26px;
  margin-bottom:20px;
}

/* 🔥 الفورم */
.box{
  background:#0f172a;
  padding:15px;
  border-radius:16px;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
  background:#1e293b;
  color:white;
}

/* 🔥 زر */
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border-radius:12px;
  border:none;
  font-size:16px;
  background:#22c55e;
  color:black;
  font-weight:bold;
}

/* 🔥 الكروت */
.card{
  background:#0f172a;
  padding:15px;
  border-radius:16px;
  margin-bottom:12px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}

.profit{
  font-size:18px;
  font-weight:bold;
  color:#22c55e;
}

.del{
  margin-top:10px;
  background:#ef4444;
  color:white;
}

/* 🔥 التوتال */
.total{
  text-align:center;
  font-size:22px;
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="box">
<input id="name" placeholder="Customer Name">

<select id="sub">
<option>Netflix</option>
<option>Shahid</option>
<option>5.5 GB</option>
<option>11 GB</option>
<option>16.5 GB</option>
<option>22 GB</option>
<option>33 GB</option>
<option>44 GB</option>
<option>55 GB</option>
<option>66 GB</option>
<option>77 GB</option>
<option>88 GB</option>
<option>100 GB</option>
</select>

<input id="cost" placeholder="Cost $" type="number">
<input id="sell" placeholder="Sell $" type="number">

<button onclick="add()">+ Add</button>
</div>

<div id="list"></div>

<div class="total">
Total: <span id="total">0</span> $
</div>

<script>
let data = JSON.parse(localStorage.getItem("data")||"[]");

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function render(){
 let list=document.getElementById("list");
 list.innerHTML="";
 let total=0;

 data.forEach((x,i)=>{
 let profit=(x.sell-x.cost)||0;
 total+=profit;

 list.innerHTML+=`
 <div class="card">
   <div class="row"><b>${x.name}</b><span>${x.sub}</span></div>
   <div class="row"><span>Cost</span><span>${x.cost}$</span></div>
   <div class="row"><span>Sell</span><span>${x.sell}$</span></div>
   <div class="row"><span>Profit</span><span class="profit">${profit.toFixed(2)}$</span></div>
   <button class="del" onclick="del(${i})">Delete</button>
 </div>
 `;
 });

 document.getElementById("total").innerText=total.toFixed(2);
}

function add(){
 let name=document.getElementById("name").value;
 let sub=document.getElementById("sub").value;
 let cost=parseFloat(document.getElementById("cost").value);
 let sell=parseFloat(document.getElementById("sell").value);

 if(!name || isNaN(cost) || isNaN(sell)) return;

 data.push({name,sub,cost,sell});
 save();

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";

 render();
}

function del(i){
 data.splice(i,1);
 save();
 render();
}

render();
</script>

</body>
</html>
