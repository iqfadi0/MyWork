<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:10px}
h2{text-align:center}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden}
th,td{padding:8px;text-align:center;border-bottom:1px solid #334155}
input,select{width:100%;padding:6px;border:none;border-radius:5px}
.add{width:100%;margin-top:10px;background:#22c55e;color:#fff;padding:10px;border:none;border-radius:10px}
.del{background:#ef4444;color:#fff;border:none;padding:6px;border-radius:6px}
.total{margin-top:10px;text-align:center;font-size:18px}
</style>
</head>
<body>

<h2>Sales Tracker</h2>

<table>
<thead>
<tr>
<th>Customer</th>
<th>Subscription</th>
<th>Cost</th>
<th>Sell</th>
<th>Profit</th>
<th>Action</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<button class="add" onclick="addRow()">+ Add</button>
<div class="total" id="total"></div>

<script>
let data = JSON.parse(localStorage.getItem("data")||"[]");

const options = ["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(i){
 let cost=parseFloat((data[i].cost||"0").replace(",","."));
 let sell=parseFloat((data[i].sell||"0").replace(",","."));
 return (!isNaN(cost)&&!isNaN(sell))?(sell-cost):0;
}

function render(){
 let body=document.getElementById("body");
 body.innerHTML="";
 data.forEach((r,i)=>{
 let p=calc(i);

 let selectOptions = options.map(o => 
  `<option ${r.sub==o?"selected":""}>${o}</option>`
 ).join("");

 let tr=document.createElement("tr");
 tr.innerHTML=`
<td><input value="${r.customer||""}" oninput="update(${i},'customer',this.value)"></td>
<td><select onchange="update(${i},'sub',this.value)">${selectOptions}</select></td>
<td><input value="${r.cost||""}" oninput="update(${i},'cost',this.value)"></td>
<td><input value="${r.sell||""}" oninput="update(${i},'sell',this.value)"></td>
<td id="p${i}">${p.toFixed(2)}</td>
<td><button class="del" onclick="delRow(${i})">X</button></td>`;
 body.appendChild(tr);
 });
 updateTotal();
}

function update(i,k,v){
 data[i][k]=v;
 save();

 let profit = calc(i);
 document.getElementById("p"+i).innerText = profit.toFixed(2);
 updateTotal();
}

function addRow(){
 data.push({});
 save();
 render();
}

function delRow(i){
 data.splice(i,1);
 save();
 render();
}

function updateTotal(){
 let total=0;
 data.forEach((r,i)=>{
 total+=calc(i);
 });
 document.getElementById("total").innerText="Total: "+total.toFixed(2);
}

render();
</script>

</body>
</html>
