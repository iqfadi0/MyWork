<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  padding:15px;
}

h1{text-align:center;margin-bottom:20px}

/* login */
.login{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.login input{
  padding:15px;
  border-radius:10px;
  border:none;
  width:70%;
  margin-top:10px;
}

.login button{
  margin-top:10px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  width:70%;
}

/* box */
.box{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#1e293b;
  color:white;
}

input:focus,select:focus{
  outline:none;
  box-shadow:0 0 0 2px #22c55e;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-weight:bold;
}

/* card */
.card{
  background:linear-gradient(145deg,#0f172a,#020617);
  padding:16px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

.del{
  background:linear-gradient(135deg,#ef4444,#b91c1c);
}

.total{
  text-align:center;
  margin-top:20px;
  font-size:20px;
}

#report{
  display:none;
  background:#0f172a;
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- login -->
<div class="login" id="login">
<h2>Enter Password</h2>
<input type="password" id="pass">
<button onclick="check()">Enter</button>
</div>

<h1>Fadi Store</h1>

<div class="box">
<input placeholder="Customer Name" id="name">

<select id="sub"></select>

<input type="number" inputmode="decimal" placeholder="Cost $" id="cost">
<input type="number" inputmode="decimal" placeholder="Sell $" id="sell">

<button onclick="add()">+ Add</button>

<input placeholder="🔍 Search..." id="search" oninput="render()">

<button onclick="showReport()">📊 Reports</button>
</div>

<div id="list"></div>
<div class="total" id="total"></div>

<div id="report">
<h2>📊 Reports</h2>
<div id="reportData"></div>
<button onclick="closeReport()">Close</button>
</div>

<script>
const PASSWORD="Fadi!!@@1122$$";

function check(){
 if(document.getElementById("pass").value===PASSWORD){
  document.getElementById("login").style.display="none";
 }
}

let data=JSON.parse(localStorage.getItem("data")||"[]");

const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(r){
 let c=Number(r.cost);
 let s=Number(r.sell);
 if(isNaN(c)||isNaN(s)) return 0;
 return s-c;
}

/* swipe */
let start=0;
function startX(e){start=e.changedTouches[0].screenX;}
function endX(e,i){
 let end=e.changedTouches[0].screenX;
 if(start-end>80){del(i);}
}

function render(){
 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{
 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let p=calc(r);
 total+=p;

 let color=p>=0?"#22c55e":"#ef4444";

 list.innerHTML+=`
 <div class="card" ontouchstart="startX(event)" ontouchend="endX(event,${i})">
  <b>${r.name||""}</b>
  <div class="row"><span>${r.sub}</span></div>
  <div class="row"><span>Cost</span><span>${Number(r.cost||0).toFixed(2)}$</span></div>
  <div class="row"><span>Sell</span><span>${Number(r.sell||0).toFixed(2)}$</span></div>
  <div class="row"><span>Profit</span><span style="color:${color}">${p.toFixed(2)}$</span></div>
  <button class="del" onclick="del(${i})">Delete</button>
 </div>`;
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

function add(){
 let n=document.getElementById("name").value;
 let s=document.getElementById("sub").value;
 let c=document.getElementById("cost").value;
 let se=document.getElementById("sell").value;

 data.push({name:n,sub:s,cost:c,sell:se});
 save();
 render();

 name.value="";cost.value="";sell.value="";
}

function del(i){
 data.splice(i,1);
 save();
 render();
}

/* report */
function showReport(){
 let total=0,count=data.length,best=0;

 data.forEach(r=>{
  let p=calc(r);
  total+=p;
  if(p>best) best=p;
 });

 document.getElementById("reportData").innerHTML=
 `Total Profit: ${total.toFixed(2)} $<br>
 Customers: ${count}<br>
 Best Profit: ${best.toFixed(2)} $`;

 document.getElementById("report").style.display="block";
}

function closeReport(){
 document.getElementById("report").style.display="none";
}

render();
</script>

</body>
</html>
