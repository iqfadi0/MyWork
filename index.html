<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">

<title>Fadi Store</title>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  overflow:hidden;
}

/* HEADER */
.header{
  text-align:center;
  padding:15px;
  font-size:20px;
  font-weight:700;
}

/* CONTENT */
.content{
  height:calc(100vh - 120px);
  overflow:auto;
  padding:10px;
}

/* GLASS BOX */
.box{
  background:rgba(30,41,59,0.4);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

/* INPUT */
input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  background:#1e293b;
  color:white;
}

/* BUTTON */
.add{
  margin-top:12px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  font-weight:bold;
}

/* CARD */
.card{
  background:linear-gradient(180deg,#0f172a,#020617);
  border-radius:20px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
  animation:fade 0.3s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* HEADER CARD */
.card-top{
  display:flex;
  justify-content:space-between;
}

.name{
  font-weight:600;
  font-size:16px;
}

.time{
  font-size:11px;
  color:#94a3b8;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}

/* COLORS */
.green{color:#22c55e}
.red{color:#ef4444}

/* DELETE */
.delete{
  background:#ef4444;
  border:none;
  width:26px;
  height:26px;
  border-radius:50%;
  color:white;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1e293b;
  margin-bottom:10px;
}

/* TOTAL */
.total{
  text-align:center;
  margin-top:10px;
  font-size:18px;
  color:#94a3b8;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(20px);
  padding:10px;
  gap:10px;
}

.nav button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#1e293b;
  color:white;
  font-size:18px;
}

.nav button.active{
  background:#22c55e;
  color:black;
}

</style>
</head>

<body>

<div class="header">Fadi Store</div>

<div class="content">

<!-- HOME -->
<div id="homePage">
<div class="box">
<input id="name" placeholder="Customer Name">
<select id="sub"></select>
<input id="cost" type="number" placeholder="Cost $">
<input id="sell" type="number" placeholder="Sell $">
<button class="add" onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input id="search" class="search" placeholder="Search..." oninput="render()">
<div id="list"></div>
<div id="total" class="total"></div>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home',this)" class="active">🏠</button>
<button onclick="showPage('customers',this)">👥</button>
</div>

<script>

let data = JSON.parse(localStorage.getItem("data")||"[]");

const options=["None","Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function getTime(){
 return new Date().toLocaleString();
}

function calc(r){
 return (Number(r.sell)-Number(r.cost))||0;
}

function showPage(p,btn){

 homePage.style.display="none";
 customersPage.style.display="none";

 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");

 if(p==="home") homePage.style.display="block";
 if(p==="customers"){
   customersPage.style.display="block";
   render();
 }
}

function render(){

 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{

 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let cost=parseFloat(r.cost)||0;
 let sell=parseFloat(r.sell)||0;
 let p=sell-cost;
 total+=p;

 list.innerHTML+=`
 <div class="card">

  <div class="card-top">
    <div>
      <div class="name">${r.name}</div>
      <div class="time">${r.time}</div>
    </div>
    <button class="delete" onclick="del(${i})">×</button>
  </div>

  <div style="margin-top:6px">${r.sub}</div>

  <div class="row"><span>Cost</span><span>${cost.toFixed(2)}$</span></div>
  <div class="row"><span>Sell</span><span>${sell.toFixed(2)}$</span></div>

  <div class="row">
    <span>Profit</span>
    <span class="${p>=0?'green':'red'}">${p.toFixed(2)}$</span>
  </div>

 </div>`;
 });

 total.innerText="Total: "+total.toFixed(2)+" $";
}

function add(){

 let n=document.getElementById("name").value.trim();

 if(!n){
   alert("Enter name");
   return;
 }

 data.unshift({
   name:n,
   sub:sub.value,
   cost:parseFloat(cost.value)||0,
   sell:parseFloat(sell.value)||0,
   time:getTime()
 });

 save();
 render();

 name.value="";
 cost.value="";
 sell.value="";
}

function del(i){
 if(confirm("Delete this customer?")){
   data.splice(i,1);
   save();
   render();
 }
}

</script>

</body>
</html>
