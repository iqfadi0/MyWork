<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  padding:15px;
}

h1{text-align:center;margin-bottom:15px}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  background:#22c55e;
  color:black;
  font-size:18px;
}

.box{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#1e293b;
  color:white;
}

button{
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:black;
  font-weight:bold;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

.total{
  text-align:center;
  margin-top:20px;
  font-size:20px;
}
</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
<button onclick="showPage('report')">📊</button>
</div>

<!-- HOME -->
<div id="homePage">
<div class="box">
<input placeholder="Customer Name" id="name">
<select id="sub"></select>
<input type="number" placeholder="Cost $" id="cost">
<input type="number" placeholder="Sell $" id="sell">
<button onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input placeholder="🔍 Search..." id="search" oninput="render()">
<div id="list"></div>
<div class="total" id="total"></div>
</div>

<!-- REPORT -->
<div id="reportPage" style="display:none">
<div id="reportData"></div>
</div>

<script>

// 🔥 حل المشكلة: إذا في بيانات قديمة فيها undefined → تنظيف
let data = JSON.parse(localStorage.getItem("data")||"[]")
  .map(r => ({
    name: r.name || "",
    sub: r.sub || "",
    cost: r.cost || 0,
    sell: r.sell || 0
  }));

const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(r){
 let c=Number(r.cost);
 let s=Number(r.sell);
 if(isNaN(c)||isNaN(s)) return 0;
 return s-c;
}

function showPage(p){
 document.getElementById("homePage").style.display="none";
 document.getElementById("customersPage").style.display="none";
 document.getElementById("reportPage").style.display="none";

 if(p==="home") document.getElementById("homePage").style.display="block";
 if(p==="customers"){
   document.getElementById("customersPage").style.display="block";
   render();
 }
 if(p==="report"){
   document.getElementById("reportPage").style.display="block";
   showReport();
 }
}

function render(){
 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{
 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let p=calc(r);
 total+=p;

 let color=p>=0?"#22c55e":"#ef4444";

 list.innerHTML+=`
 <div class="card">
  <div style="display:flex;justify-content:space-between">
   <b>${r.name || "No Name"}</b>
   <span>${r.sub}</span>
  </div>

  <div class="row"><span>Cost</span><span>${Number(r.cost||0).toFixed(2)}$</span></div>
  <div class="row"><span>Sell</span><span>${Number(r.sell||0).toFixed(2)}$</span></div>

  <div class="row">
   <span>Profit</span>
   <span style="color:${color}">${p.toFixed(2)}$</span>
  </div>
 </div>`;
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

function add(){
 let n = document.getElementById("name").value.trim();
 let s = document.getElementById("sub").value;
 let c = document.getElementById("cost").value;
 let se = document.getElementById("sell").value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.push({name:n,sub:s,cost:c,sell:se});

 save();
 render(); // 🔥 مهم

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";
}

function showReport(){
 let total=0,count=data.length,best=0;

 data.forEach(r=>{
  let p=calc(r);
  total+=p;
  if(p>best) best=p;
 });

 document.getElementById("reportData").innerHTML=
 `Total Profit: ${total.toFixed(2)} $<br>
 Customers: ${count}<br>
 Best Profit: ${best.toFixed(2)} $`;
}

</script>

</body>
</html>
