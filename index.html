<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:10px}
h2{text-align:center}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:10px;overflow:hidden}
th,td{padding:10px;text-align:center;border-bottom:1px solid #334155}
input{width:100%;padding:6px;border:none;border-radius:5px}
button{width:100%;padding:12px;margin-top:10px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:18px}
.total{margin-top:15px;font-size:20px;text-align:center}
</style>
</head>
<body>

<h2>Sales Tracker</h2>

<table>
<thead>
<tr>
<th>Customer</th>
<th>Subscription</th>
<th>Cost</th>
<th>Sell</th>
<th>Profit</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>

<button onclick="addRow()">+ Add Row</button>

<div class="total" id="total">Total: 0</div>

<script>
function addRow(){
 let tr=document.createElement("tr");
 tr.innerHTML=`
<td><input></td>
<td><input></td>
<td><input oninput="calc(this)"></td>
<td><input oninput="calc(this)"></td>
<td>0</td>`;
 document.getElementById("body").appendChild(tr);
}

function calc(el){
 let row=el.parentElement.parentElement;
 let cost=parseFloat(row.children[2].children[0].value.replace(",","."));
 let sell=parseFloat(row.children[3].children[0].value.replace(",","."));
 let profit=(!isNaN(cost)&&!isNaN(sell))?(sell-cost):0;
 row.children[4].innerText=profit.toFixed(2);
 updateTotal();
}

function updateTotal(){
 let total=0;
 document.querySelectorAll("tbody tr").forEach(r=>{
 total+=parseFloat(r.children[4].innerText)||0;
 });
 document.getElementById("total").innerText="Total: "+total.toFixed(2);
}

addRow();
</script>

</body>
</html>
