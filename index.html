<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  padding:15px;
}

h1{text-align:center;margin-bottom:15px}

.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  background:#22c55e;
  color:black;
  font-size:18px;
}

.box{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
}

button{
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:black;
  font-weight:bold;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
  margin-top:12px;
  transition:0.3s;
}

.card.swipe{
  transform:translateX(-80px);
  opacity:0.5;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}

.total{
  text-align:center;
  margin-top:20px;
  font-size:22px;
}

.search{
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
  width:100%;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
<button onclick="showPage('report')">📊</button>
</div>

<div id="homePage">
<div class="box">
<input placeholder="Customer Name" id="name">
<select id="sub"></select>
<input type="number" placeholder="Cost $" id="cost">
<input type="number" placeholder="Sell $" id="sell">
<button onclick="add()">+ Add</button>
</div>
</div>

<div id="customersPage" style="display:none">
<input class="search" placeholder="🔍 Search..." id="search" oninput="render()">
<div id="list"></div>
<div class="total" id="total"></div>
</div>

<div id="reportPage" style="display:none">
<div id="reportData"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("data")||"[]");

const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

const sub = document.getElementById("sub");

options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(r){
 let c=Number(r.cost);
 let s=Number(r.sell);
 if(isNaN(c)||isNaN(s)) return 0;
 return s-c;
}

function showPage(p){
 document.getElementById("homePage").style.display="none";
 document.getElementById("customersPage").style.display="none";
 document.getElementById("reportPage").style.display="none";

 if(p==="home") document.getElementById("homePage").style.display="block";
 if(p==="customers"){document.getElementById("customersPage").style.display="block"; render();}
 if(p==="report"){document.getElementById("reportPage").style.display="block"; showReport();}
}

/* swipe */
let startX=0;

function touchStart(e){
 startX=e.touches[0].clientX;
}

function touchEnd(e,i,el){
 let endX=e.changedTouches[0].clientX;

 if(startX-endX>80){
   el.classList.add("swipe");

   setTimeout(()=>{
     if(confirm("Delete this customer?")){
       data.splice(i,1);
       save();
       render();
     }else{
       el.classList.remove("swipe");
     }
   },200);
 }
}

function render(){
 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{
 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let p=calc(r);
 total+=p;

 let color=p>=0?"#22c55e":"#ef4444";

 let div=document.createElement("div");
 div.className="card";

 div.ontouchstart=(e)=>touchStart(e);
 div.ontouchend=(e)=>touchEnd(e,i,div);

 div.innerHTML=`
 <div style="display:flex;justify-content:space-between">
   <b>${r.name || "Unknown"}</b>
   <span>${r.sub}</span>
 </div>

 <div class="row"><span>Cost</span><span>${Number(r.cost||0).toFixed(2)}$</span></div>
 <div class="row"><span>Sell</span><span>${Number(r.sell||0).toFixed(2)}$</span></div>

 <div class="row">
   <span>Profit</span>
   <span style="color:${color}">${p.toFixed(2)}$</span>
 </div>
 `;

 list.appendChild(div);
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

function add(){
 let n = document.getElementById("name").value.trim();
 let s = document.getElementById("sub").value;
 let c = document.getElementById("cost").value;
 let se = document.getElementById("sell").value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.push({name:n,sub:s,cost:c,sell:se});

 save();
 render();
 showPage("customers");

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";
}

function showReport(){
 let total=0;

 data.forEach(r=>{
  total+=calc(r);
 });

 document.getElementById("reportData").innerHTML=
 "Total Profit: "+total.toFixed(2)+" $";
}

</script>

</body>
</html>
