<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Fadi Store</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:linear-gradient(180deg,#020617,#020617,#020617,#0f172a);
  color:white;
  padding:15px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  font-weight:700;
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  background:#22c55e;
  border:none;
  border-radius:12px;
  padding:12px;
  font-size:18px;
}

/* BOX */
.box{
  background:rgba(30,41,59,0.6);
  backdrop-filter:blur(10px);
  padding:15px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  color:white;
}

button.add{
  width:100%;
  margin-top:10px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  padding:14px;
  border:none;
  border-radius:12px;
}

/* CARD */
.card-wrap{
  position:relative;
  overflow:hidden;
  margin-top:12px;
  border-radius:20px;
}

.delete-btn{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:90px;
  background:#ef4444;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.card{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
  transition:0.3s;
}

.card.swiped{
  transform:translateX(-90px);
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
}

.profit{color:#22c55e}

.total{
  text-align:center;
  margin-top:20px;
  font-size:22px;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#1e293b;
  margin-bottom:10px;
  color:white;
}
</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
<button onclick="showPage('report')">📊</button>
</div>

<!-- HOME -->
<div id="homePage">
<div class="box">
<input placeholder="Customer Name" id="name">
<select id="sub"></select>
<input type="number" placeholder="Cost $" id="cost">
<input type="number" placeholder="Sell $" id="sell">
<button class="add" onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input class="search" placeholder="🔍 Search..." id="search" oninput="render()">
<div id="list"></div>
<div class="total" id="total"></div>
</div>

<!-- REPORT -->
<div id="reportPage" style="display:none">
<div id="reportData"></div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("data")||"[]");

const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function calc(r){
 let c=Number(r.cost);
 let s=Number(r.sell);
 return (s-c)||0;
}

function showPage(p){
 homePage.style.display="none";
 customersPage.style.display="none";
 reportPage.style.display="none";

 if(p==="home") homePage.style.display="block";
 if(p==="customers"){customersPage.style.display="block"; render();}
 if(p==="report"){reportPage.style.display="block"; showReport();}
}

/* SWIPE */
let startX=0;

function touchStart(e){
 startX=e.touches[0].clientX;
}

function touchEnd(e,el){
 let endX=e.changedTouches[0].clientX;
 if(startX-endX>70){
   el.classList.add("swiped");
 }else{
   el.classList.remove("swiped");
 }
}

/* RENDER */
function render(){
 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{

 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let p=calc(r);
 total+=p;

 let wrap=document.createElement("div");
 wrap.className="card-wrap";

 wrap.innerHTML=`
 <div class="delete-btn" onclick="confirmDel(${i})">Delete</div>

 <div class="card"
 ontouchstart="touchStart(event)"
 ontouchend="touchEnd(event,this)">

   <div style="display:flex;justify-content:space-between">
     <b>${r.name || "No Name"}</b>
     <span>${r.sub}</span>
   </div>

   <div class="row"><span>Cost</span><span>${Number(r.cost||0).toFixed(2)}$</span></div>
   <div class="row"><span>Sell</span><span>${Number(r.sell||0).toFixed(2)}$</span></div>
   <div class="row"><span>Profit</span><span class="profit">${p.toFixed(2)}$</span></div>

 </div>
 `;

 list.appendChild(wrap);
 });

 totalEl.innerText="Total: "+total.toFixed(2)+" $";
}

/* ADD */
function add(){
 let n=document.getElementById("name").value.trim();
 let s=sub.value;
 let c=cost.value;
 let se=sell.value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.push({name:n,sub:s,cost:c,sell:se});
 save();
 render();
 showPage("customers");

 name.value="";
 cost.value="";
 sell.value="";
}

/* DELETE CONFIRM */
function confirmDel(i){
 if(confirm("Delete this customer?")){
   data.splice(i,1);
   save();
   render();
 }
}

/* REPORT */
function showReport(){
 let total=0;

 data.forEach(r=>{
  total+=calc(r);
 });

 reportData.innerHTML="Total Profit: "+total.toFixed(2)+" $";
}

</script>

</body>
</html>
