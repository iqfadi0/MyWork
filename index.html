<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">

<title>Fadi Store</title>

<style>

body{
  margin:0;
  font-family:-apple-system;
  background:#020617;
  color:white;
  overflow:hidden;
}

/* APP */
.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  text-align:center;
  padding:15px;
  font-size:20px;
  font-weight:700;
}

/* NAV */
.nav{
  display:flex;
  gap:10px;
  padding:0 12px;
}

.nav button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:16px;
  background:#1e293b;
  color:#94a3b8;
  font-size:18px;
}

.nav button:active{
  background:#22c55e;
  color:black;
}

/* CONTENT */
.content{
  flex:1;
  overflow:auto;
}

/* BOX */
.box{
  margin:12px;
  background:#0f172a;
  padding:15px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

/* INPUT */
input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  background:#1e293b;
  color:white;
}

/* ADD BUTTON */
.add{
  margin-top:12px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:black;
  font-weight:bold;
}

/* SEARCH */
.search{
  margin:12px;
  width:calc(100% - 24px);
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1e293b;
}

/* CARD */
.card{
  margin:10px 12px;
  background:#0f172a;
  border-radius:20px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

/* HEADER CARD */
.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.name{
  font-size:16px;
  font-weight:600;
}

.time{
  font-size:11px;
  color:#64748b;
}

.sub{
  font-size:14px;
  color:#94a3b8;
  margin-top:6px;
}

/* ROW */
.row{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
}

/* COLORS */
.green{color:#22c55e}
.red{color:#ef4444}

/* DELETE */
.delete-x{
  background:#ef4444;
  border:none;
  width:24px;
  height:24px;
  border-radius:50%;
  color:white;
}

/* TOTAL */
.total{
  text-align:center;
  margin:15px;
  font-size:18px;
  color:#94a3b8;
}

</style>
</head>

<body>

<div class="app">

<div class="header">Fadi Store</div>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
</div>

<div class="content">

<!-- HOME -->
<div id="homePage">
<div class="box">
<input id="name" placeholder="Customer Name">
<select id="sub"></select>
<input id="cost" type="number" placeholder="Cost $">
<input id="sell" type="number" placeholder="Sell $">
<button class="add" onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input id="search" class="search" placeholder="Search..." oninput="render()">
<div id="list"></div>
<div id="total" class="total"></div>
</div>

</div>
</div>

<script>

let data = JSON.parse(localStorage.getItem("data")||"[]");

const options=["None","Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

function getTime(){
 return new Date().toLocaleString();
}

function calc(r){
 return (Number(r.sell)-Number(r.cost))||0;
}

function showPage(p){
 homePage.style.display="none";
 customersPage.style.display="none";

 if(p==="home") homePage.style.display="block";
 if(p==="customers"){
   customersPage.style.display="block";
   render();
 }
}

function render(){

 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{

 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let cost=parseFloat(r.cost)||0;
 let sell=parseFloat(r.sell)||0;
 let p=sell-cost;
 total+=p;

 list.innerHTML+=`
 <div class="card">

   <div class="card-header">
     <div>
       <div class="name">${r.name}</div>
       <div class="time">${r.time}</div>
     </div>
     <button class="delete-x" onclick="del(${i})">×</button>
   </div>

   <div class="sub">${r.sub}</div>

   <div class="row"><span>Cost</span><span>${cost.toFixed(2)}$</span></div>
   <div class="row"><span>Sell</span><span>${sell.toFixed(2)}$</span></div>

   <div class="row">
     <span>Profit</span>
     <span class="${p>=0?'green':'red'}">${p.toFixed(2)}$</span>
   </div>

 </div>`;
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

/* ADD FIXED */
function add(){

 let n=document.getElementById("name").value.trim();
 let s=document.getElementById("sub").value;
 let c=document.getElementById("cost").value;
 let se=document.getElementById("sell").value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.unshift({
   name:n,
   sub:s,
   cost:parseFloat(c)||0,
   sell:parseFloat(se)||0,
   time:getTime()
 });

 save();
 render();
 showPage("customers");

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";
}

function del(i){
 if(confirm("Delete this customer?")){
   data.splice(i,1);
   save();
   render();
 }
}

</script>

</body>
</html>
