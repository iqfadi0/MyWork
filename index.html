<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Fadi Store</title>

<style>

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#020617;
  color:white;
  padding:12px;
}

/* HEADER */
h1{
  text-align:center;
  margin:10px 0 20px;
  font-size:22px;
  font-weight:700;
}

/* NAV */
.nav{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.nav button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#22c55e;
  font-size:16px;
}

/* BOX */
.box{
  background:#0f172a;
  padding:15px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* INPUT */
input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  background:#1e293b;
  color:white;
  font-size:15px;
}

/* ADD BUTTON */
.add{
  width:100%;
  margin-top:12px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  font-size:16px;
}

/* CARD */
.card{
  background:#0f172a;
  border-radius:20px;
  padding:15px;
  margin-top:12px;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:14px;
}

/* PROFIT */
.green{color:#22c55e}
.red{color:#ef4444}

/* DELETE */
.delete-x{
  background:#ef4444;
  border:none;
  width:26px;
  height:26px;
  border-radius:50%;
  color:white;
  font-size:16px;
}

/* SEARCH */
.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  background:#1e293b;
  margin-bottom:10px;
}

/* TIME */
.time{
  font-size:11px;
  color:#94a3b8;
  margin-top:3px;
}

/* TOTAL */
.total{
  text-align:center;
  margin-top:20px;
  font-size:20px;
}

</style>
</head>

<body>

<h1>Fadi Store</h1>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('customers')">👥</button>
</div>

<!-- HOME -->
<div id="homePage">
<div class="box">
<input id="name" placeholder="Customer Name">
<select id="sub"></select>
<input id="cost" type="number" placeholder="Cost $">
<input id="sell" type="number" placeholder="Sell $">
<button class="add" onclick="add()">+ Add</button>
</div>
</div>

<!-- CUSTOMERS -->
<div id="customersPage" style="display:none">
<input id="search" class="search" placeholder="Search..." oninput="render()">
<div id="list"></div>
<div id="total" class="total"></div>
</div>

<script>

/* DATA */
let data = JSON.parse(localStorage.getItem("data")||"[]");

/* OPTIONS */
const options=["Netflix","Shahid","5.5 GB","11 GB","16.5 GB","22 GB","33 GB","44 GB","55 GB","66 GB","77 GB","88 GB","100 GB"];

let sub=document.getElementById("sub");
options.forEach(o=>{
 let opt=document.createElement("option");
 opt.text=o;
 sub.add(opt);
});

/* SAVE */
function save(){
 localStorage.setItem("data",JSON.stringify(data));
}

/* TIME */
function getTime(){
 let d=new Date();
 return d.toLocaleString();
}

/* CALC */
function calc(r){
 return (Number(r.sell)-Number(r.cost))||0;
}

/* NAV */
function showPage(p){
 document.getElementById("homePage").style.display="none";
 document.getElementById("customersPage").style.display="none";

 if(p==="home") document.getElementById("homePage").style.display="block";
 if(p==="customers"){
   document.getElementById("customersPage").style.display="block";
   render();
 }
}

/* RENDER */
function render(){

 let list=document.getElementById("list");
 let keyword=document.getElementById("search").value.toLowerCase();
 list.innerHTML="";
 let total=0;

 data.forEach((r,i)=>{

 if(r.name && !r.name.toLowerCase().includes(keyword)) return;

 let cost=parseFloat(r.cost)||0;
 let sell=parseFloat(r.sell)||0;
 let p=sell-cost;
 total+=p;

 list.innerHTML+=`
 <div class="card">

   <div style="display:flex;justify-content:space-between">
     <b>${r.name}</b>
     <button class="delete-x" onclick="del(${i})">×</button>
   </div>

   <div class="time">${r.time}</div>

   <div>${r.sub}</div>

   <div class="row"><span>Cost</span><span>${cost.toFixed(2)}$</span></div>
   <div class="row"><span>Sell</span><span>${sell.toFixed(2)}$</span></div>

   <div class="row">
     <span>Profit</span>
     <span class="${p>=0?'green':'red'}">${p.toFixed(2)}$</span>
   </div>

 </div>`;
 });

 document.getElementById("total").innerText="Total: "+total.toFixed(2)+" $";
}

/* ADD (FIXED) */
function add(){

 let n=document.getElementById("name").value.trim();
 let s=document.getElementById("sub").value;
 let c=document.getElementById("cost").value;
 let se=document.getElementById("sell").value;

 if(!n){
   alert("Enter name");
   return;
 }

 data.unshift({
   name:n,
   sub:s,
   cost:parseFloat(c)||0,
   sell:parseFloat(se)||0,
   time:getTime()
 });

 save();
 render();
 showPage("customers");

 document.getElementById("name").value="";
 document.getElementById("cost").value="";
 document.getElementById("sell").value="";
}

/* DELETE */
function del(i){
 if(confirm("Delete this customer?")){
   data.splice(i,1);
   save();
   render();
 }
}

</script>

</body>
</html>
